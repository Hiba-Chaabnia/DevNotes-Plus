name: Bug report
description: Something in DevNotes+ behaves incorrectly.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the DevNotes sidebar
        2. Press Ctrl+Alt+Q
        3. ...
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Environment
      description: Filled in automatically when you open this from the extension's overflow menu.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues for this problem.
          required: true
